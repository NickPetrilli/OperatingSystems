<!DOCTYPE HTML>
<html lang="en">
<head>
   <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
   <meta name="author"             content="Alan G. Labouseur" />
   <link rel="stylesheet" href="tsos.css" type="text/css" media="screen" />
   <title>NickOS</title>

   <!-- Globals CONSTANTS and _Variables. Must included be first. -->
   <script type="text/javascript" src="distrib/globals.js"></script>

   <!-- Host (Virtual Machine / Hardware Simulation) Routines -->
   <script type="text/javascript" src="distrib/host/control.js"></script>
   <script type="text/javascript" src="distrib/host/devices.js"></script>
   <script type="text/javascript" src="distrib/host/cpu.js"></script>
   <script type="text/javascript" src="distrib/host/memory.js"></script>
   <script type="text/javascript" src="distrib/host/memoryAccessor.js"></script>
   <script type="text/javascript" src="distrib/host/disk.js"></script>

   <!-- Virtual OS Routines: Make sure Kernel code is last, since it needs those above it. -->
   <script type="text/javascript" src="distrib/os/interrupt.js"></script>
   <script type="text/javascript" src="distrib/os/canvastext.js"></script>
   <script type="text/javascript" src="distrib/os/console.js"></script>
   <script type="text/javascript" src="distrib/os/deviceDriver.js"></script>
   <script type="text/javascript" src="distrib/os/deviceDriverKeyboard.js"></script>
   <script type="text/javascript" src="distrib/os/queue.js"></script>
   <script type="text/javascript" src="distrib/os/shell.js"></script>
   <script type="text/javascript" src="distrib/os/shellCommand.js"></script>
   <script type="text/javascript" src="distrib/os/userCommand.js"></script>
   <script type="text/javascript" src="distrib/os/memoryManager.js"></script>
   <script type="text/javascript" src="distrib/os/processControlBlock.js"></script>
   <script type="text/javascript" src="distrib/os/cpuScheduler.js"></script>
   <script type="text/javascript" src="distrib/os/cpuDispatcher.js"></script>
   <script type="text/javascript" src="distrib/os/cpuSwapper.js"></script>
   <script type="text/javascript" src="distrib/os/deviceDriverDisk.js"></script>
   <script type="text/javascript" src="distrib/os/kernel.js"></script>

   <!-- Other Routines -->
   <script type="text/javascript" src="distrib/utils.js"></script>
   <!-- Uncomment the line below to enable GLaDOS testing. -->
   <script type="text/javascript" src="test/glados-ip4.js"></script>

   <script>
      setInterval(function () {
         var today = new Date();
         var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
         var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

         var date = days[today.getDay()] + ", " + months[today.getMonth()] + ' ' + today.getDate() + ", " + today.getFullYear();
         var minutes = today.getMinutes() > 9 ? today.getMinutes() : "0" + today.getMinutes();
         var seconds = today.getSeconds() > 9 ? today.getSeconds() : "0" + today.getSeconds();

         var ampm = "AM";
         var hours = today.getHours();
         if (hours > 11) {
            ampm = "PM";
            if (hours > 12) {
               hours -= 12;
            }
         }
            if (hours == 0) {
               hours = 12;
            }

         var time = hours + ":" + minutes + ":" + seconds + " " + ampm;
         document.getElementById("dateAndTime").innerHTML = date + " " + time;
      }, 1000);
   </script>

</head>

<body onload="onDocumentLoad()">

   <!-- ── Header Bar ───────────────────────────────────────────── -->
   <header id="nickos-header">
      <div id="header-logo">
         <span class="logo-icon">&#9672;</span>NICKOS
      </div>
      <div id="header-status">
         <div id="divStatus">
            <script>
               //starting status message
               let status = "Status: I love Operating Systems";
               document.getElementById("divStatus").innerHTML = status;
            </script>
         </div>
      </div>
      <div id="dateAndTime"></div>
   </header>

   <!-- ── Control Bar ──────────────────────────────────────────── -->
   <nav id="nickos-controls">
      <input type="button"
             id="btnStartOS"
             name="brnStartOS"
             class="start_button"
             value="&#9654; START"
             tabindex="0"
             onclick="TSOS.Control.hostBtnStartOS_click(this);">

      <input type="button"
             id="btnHaltOS"
             name="brnHaltOS"
             class="halt_button"
             disabled="disabled"
             value="&#9632; HALT"
             tabindex="1"
             onclick="TSOS.Control.hostBtnHaltOS_click(this);">

      <input type="button"
             id="btnReset"
             name="brnReset"
             class="reset_button"
             disabled="disabled"
             value="&#8635; RESET"
             tabindex="2"
             onclick="TSOS.Control.hostBtnReset_click(this);">

      <div class="ctrl-sep"></div>

      <input type="button"
             id="btnSingleStep"
             name="btnSingleStep"
             class="singleStep_button"
             disabled="disabled"
             value="&#11036; SINGLE-STEP: OFF"
             tabindex="3"
             onclick="TSOS.Control.hostBtnSingleStep_click(this);">

      <input type="button"
             id="btnStep"
             name="btnStep"
             class="step_button"
             disabled="disabled"
             value="&#9655;"
             tabindex="4"
             onclick="TSOS.Control.hostBtnStep_click(this);">
   </nav>

   <!-- ── Main Area ────────────────────────────────────────────── -->
   <main id="nickos-main">

      <!-- Terminal Column -->
      <section id="panel-terminal" class="panel">
         <div class="panel-label">
            <span class="dot dot-cyan"></span>TERMINAL
         </div>
         <div id="divConsole">
            <canvas id="display"
                    width="500"
                    height="500"
                    tabindex="5">
            </canvas>
         </div>
      </section>

      <!-- Info Column -->
      <aside id="panel-info-col">

         <!-- CPU Registers -->
         <section id="panel-cpu" class="panel">
            <div class="panel-label">
               <span class="dot dot-amber"></span>CPU REGISTERS
            </div>
            <div class="panel-body" style="padding:4px 6px;">
               <table name="cpuTable" id="cpuTable" class="cpuTable"></table>
            </div>
         </section>

         <!-- Process Table -->
         <section id="panel-pcb" class="panel">
            <div class="panel-label">
               <span class="dot dot-green"></span>PROCESS TABLE
            </div>
            <div id="divPcbTable">
               <table name="pcbTable" id="pcbTable" class="pcbTable"></table>
            </div>
         </section>

         <!-- Program Input -->
         <section id="panel-input" class="panel">
            <div class="panel-label">
               <span class="dot dot-purple"></span>PROGRAM INPUT
            </div>
            <div class="panel-body">
               <textarea name="taProgramInput"
                         id="taProgramInput"
                         rows="6"
                         spellcheck="false"
               ></textarea>
            </div>
         </section>

      </aside>
   </main>

   <!-- ── Bottom Row ───────────────────────────────────────────── -->
   <footer id="nickos-bottom">

      <!-- Memory -->
      <section id="panel-memory" class="panel">
         <div class="panel-label">
            <span class="dot dot-blue"></span>MEMORY
         </div>
         <div id="divMemoryTable">
            <table name="memoryTable" id="memoryTable" class="memoryTable"></table>
         </div>
      </section>

      <!-- Disk -->
      <section id="panel-disk" class="panel">
         <div class="panel-label">
            <span class="dot dot-amber"></span>DISK
         </div>
         <div id="divDiskTable">
            <table name="diskTable" id="diskTable" class="diskTable"></table>
         </div>
      </section>

      <!-- Host Log -->
      <section id="panel-log" class="panel">
         <div class="panel-label">
            <span class="dot dot-green"></span>HOST LOG
         </div>
         <div class="panel-body">
            <div id="taHostLog"></div>
         </div>
      </section>

   </footer>

</body>
</html>
