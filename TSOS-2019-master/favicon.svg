<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="3" fill="#07090f"/>

  <!-- Pins - top (3, bold) -->
  <rect x="9"  y="1" width="3" height="5" fill="#00d4ff"/>
  <rect x="15" y="1" width="3" height="5" fill="#00d4ff"/>
  <rect x="21" y="1" width="3" height="5" fill="#00d4ff"/>

  <!-- Pins - bottom -->
  <rect x="9"  y="26" width="3" height="5" fill="#00d4ff"/>
  <rect x="15" y="26" width="3" height="5" fill="#00d4ff"/>
  <rect x="21" y="26" width="3" height="5" fill="#00d4ff"/>

  <!-- Pins - left -->
  <rect x="1" y="9"  width="5" height="3" fill="#00d4ff"/>
  <rect x="1" y="15" width="5" height="3" fill="#00d4ff"/>
  <rect x="1" y="21" width="5" height="3" fill="#00d4ff"/>

  <!-- Pins - right -->
  <rect x="26" y="9"  width="5" height="3" fill="#00d4ff"/>
  <rect x="26" y="15" width="5" height="3" fill="#00d4ff"/>
  <rect x="26" y="21" width="5" height="3" fill="#00d4ff"/>

  <!-- Chip body -->
  <rect x="6" y="6" width="20" height="20" rx="1.5" fill="#0d1526" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- Inner die -->
  <rect x="9" y="9" width="14" height="14" fill="#060d1a" stroke="#0077bb" stroke-width="1"/>

  <!-- Circuit grid lines -->
  <line x1="9"  y1="12.7" x2="23" y2="12.7" stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>
  <line x1="9"  y1="16"   x2="23" y2="16"   stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>
  <line x1="9"  y1="19.3" x2="23" y2="19.3" stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>
  <line x1="12.7" y1="9"  x2="12.7" y2="23" stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>
  <line x1="16"   y1="9"  x2="16"   y2="23" stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>
  <line x1="19.3" y1="9"  x2="19.3" y2="23" stroke="#00d4ff" stroke-width="0.6" opacity="0.55"/>

  <!-- Bright center core -->
  <rect x="13.5" y="13.5" width="5" height="5" fill="#00d4ff"/>

  <!-- Notch -->
  <circle cx="7.8" cy="7.8" r="1.2" fill="#00d4ff" opacity="0.8"/>
</svg>
